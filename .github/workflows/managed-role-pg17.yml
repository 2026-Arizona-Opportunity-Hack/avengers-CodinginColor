name: PostgreSQL 17 managed role rehearsal

on:
  workflow_dispatch:
  pull_request:
    paths:
      - tests/managed-role-pg17.test.mjs
      - tests/invitation-repair-pg17.test.mjs
      - tests/fixtures/staff-invitations-historical.sql
      - tools/repair-invitation-history.mjs
      - .github/workflows/managed-role-pg17.yml

permissions:
  contents: read

jobs:
  rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: cic_rehearsal
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.15.0
          cache: npm
      - run: npm ci
      - name: Rehearse synthetic managed role privileges
        run: node --test tests/managed-role-pg17.test.mjs && node --test tests/invitation-repair-pg17.test.mjs
        env:
          CIC_PG17_REHEARSAL_URL: postgresql://postgres@127.0.0.1:5432/cic_rehearsal
